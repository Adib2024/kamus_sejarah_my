<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kamus Sejarah MY — lebih 600 istilah Sejarah untuk guru dan pelajar, dengan carian pantas, flashcard dan kuiz." />
    <meta name="theme-color" content="#101c2c" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Kamus Sejarah MY</title>
    <script>
      // elak "flash" tema/saiz tulisan sebelum app dimuat
      try {
        var t = JSON.parse(localStorage.getItem('ksm:tema') || '"sistem"')
        var d = t === 'gelap' || (t === 'sistem' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.dataset.fs = JSON.parse(localStorage.getItem('ksm:saiz') || '0')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- paparan memuat: diganti sebaik sahaja app sedia -->
      <div style="min-height:100dvh;display:grid;place-items:center;background:#101c2c">
        <div style="text-align:center">
          <img src="./favicon.svg" alt="" width="64" height="64" style="border-radius:16px" />
          <div style="margin:18px auto 0;width:120px;height:2px;background:rgba(198,161,91,.25);overflow:hidden;border-radius:2px">
            <div style="width:40%;height:100%;background:#c6a15b;animation:shimmer 1.1s ease-in-out infinite"></div>
          </div>
        </div>
      </div>
      <style>@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(250%)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
